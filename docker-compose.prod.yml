version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sabquick-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - sabquick-prod-net

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sabquick-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - sabquick-prod-net

  # ----------------------------------------------------------------------------
  # Next.js Standalone Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabquick-app-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      HUB_LATITUDE: ${HUB_LATITUDE:-28.6289}
      HUB_LONGITUDE: ${HUB_LONGITUDE:-77.2065}
      GEOFENCE_RADIUS_KM: ${GEOFENCE_RADIUS_KM:-2.5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - sabquick-prod-net

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy & Automatic Let's Encrypt TLS (HTTP/3)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: sabquick-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - sabquick-prod-net

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ------------------------------------------------------------------------------
# Production Network Isolation
# ------------------------------------------------------------------------------
networks:
  sabquick-prod-net:
    driver: bridge
