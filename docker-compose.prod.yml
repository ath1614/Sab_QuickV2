version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sabquick-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - sabquick-prod-net

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sabquick-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - sabquick-prod-net

  # ----------------------------------------------------------------------------
  # Next.js Standalone Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
        NEXT_PUBLIC_CASHFREE_ENV: ${NEXT_PUBLIC_CASHFREE_ENV:-production}
        NEXT_PUBLIC_STORE_LAT: ${NEXT_PUBLIC_STORE_LAT:-23.129243}
        NEXT_PUBLIC_STORE_LNG: ${NEXT_PUBLIC_STORE_LNG:-83.190082}
        NEXT_PUBLIC_STORE_MAX_RADIUS_KM: ${NEXT_PUBLIC_STORE_MAX_RADIUS_KM:-2.5}
        NEXT_PUBLIC_STORE_UPI_ID: ${NEXT_PUBLIC_STORE_UPI_ID:-yourstore@upi}
        NEXT_PUBLIC_STORE_UPI_NAME: ${NEXT_PUBLIC_STORE_UPI_NAME:-SabQuick Retail}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyBbGGhlWnPJm2BkwuGWXzpgqA0p233WrHE}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-sabquick-17da6.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-sabquick-17da6}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-sabquick-17da6.firebasestorage.app}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-197455053731}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:197455053731:web:515a1022a23c4047061016}
    container_name: sabquick-app-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      STORE_LATITUDE: ${STORE_LATITUDE:-23.129243}
      STORE_LONGITUDE: ${STORE_LONGITUDE:-83.190082}
      STORE_MAX_RADIUS_KM: ${STORE_MAX_RADIUS_KM:-2.5}
      NEXT_PUBLIC_STORE_LAT: ${NEXT_PUBLIC_STORE_LAT:-23.129243}
      NEXT_PUBLIC_STORE_LNG: ${NEXT_PUBLIC_STORE_LNG:-83.190082}
      NEXT_PUBLIC_STORE_MAX_RADIUS_KM: ${NEXT_PUBLIC_STORE_MAX_RADIUS_KM:-2.5}
      NEXT_PUBLIC_STORE_UPI_ID: ${NEXT_PUBLIC_STORE_UPI_ID:-yourstore@upi}
      NEXT_PUBLIC_STORE_UPI_NAME: ${NEXT_PUBLIC_STORE_UPI_NAME:-SabQuick Retail}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-PRODUCTION}
      NEXT_PUBLIC_CASHFREE_ENV: ${NEXT_PUBLIC_CASHFREE_ENV:-production}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2023-08-01}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
      HUB_LATITUDE: ${HUB_LATITUDE:-23.129243}
      HUB_LONGITUDE: ${HUB_LONGITUDE:-83.190082}
      GEOFENCE_RADIUS_KM: ${GEOFENCE_RADIUS_KM:-2.5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyBbGGhlWnPJm2BkwuGWXzpgqA0p233WrHE}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-sabquick-17da6.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-sabquick-17da6}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-sabquick-17da6.firebasestorage.app}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-197455053731}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:197455053731:web:515a1022a23c4047061016}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-sabquick-17da6}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-firebase-adminsdk-fbsvc@sabquick-17da6.iam.gserviceaccount.com}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    volumes:
      - uploads_prod:/app/public/uploads
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - sabquick-prod-net

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy & Automatic Let's Encrypt TLS (HTTP/3)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: sabquick-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - sabquick-prod-net

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  uploads_prod:
    driver: local

# ------------------------------------------------------------------------------
# Production Network Isolation
# ------------------------------------------------------------------------------
networks:
  sabquick-prod-net:
    driver: bridge
