# Copy this file to android/key.properties and fill in real values.
# android/key.properties and any *.keystore files are gitignored — NEVER commit them.
#
# storeFile is relative to the android/app/ directory.
# Recommended: keep the real keystore OUTSIDE the repository, e.g.
#   storeFile=/Users/you/keystores/sabquick-release.keystore
#
# After moving the keystore out of git, rotate its passwords:
#   keytool -storepasswd -keystore sabquick-release.keystore
#   keytool -keypasswd -alias sabquick -keystore sabquick-release.keystore

storeFile=sabquick-release.keystore
storePassword=YOUR_STORE_PASSWORD
keyAlias=sabquick
keyPassword=YOUR_KEY_PASSWORD
