name: SabQuick CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sabquick_admin
          POSTGRES_PASSWORD: sabquick_ci_password
          POSTGRES_DB: sabquick_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations (CI)
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
        run: |
          npx prisma migrate deploy
          npx prisma db push --skip-generate

      - name: Seed Database (CI)
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
        run: npx prisma db seed

      - name: Run Core Test Suite
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci_pipeline_secret_test_32_characters_minimum"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_STORE_LAT: "23.129243"
          NEXT_PUBLIC_STORE_LNG: "83.190082"
          NEXT_PUBLIC_STORE_MAX_RADIUS_KM: "2.5"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBbGGhlWnPJm2BkwuGWXzpgqA0p233WrHE"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "sabquick-17da6.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "sabquick-17da6"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "sabquick-17da6.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "197455053731"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:197455053731:web:515a1022a23c4047061016"
          FIREBASE_PROJECT_ID: "sabquick-17da6"
          FIREBASE_CLIENT_EMAIL: "firebase-adminsdk-fbsvc@sabquick-17da6.iam.gserviceaccount.com"
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          npx tsx scripts/verify-db.ts
          npx tsx scripts/verify-auth.ts
          npx tsx scripts/verify-geo.ts
          npx tsx scripts/verify-catalog.ts
          npx tsx scripts/verify-order.ts
          npx tsx scripts/verify-order-tracking.ts
          npx tsx scripts/verify-rider-flow.ts
          npx tsx scripts/verify-ops.ts
          npx tsx scripts/verify-razorpay-coupons-catalog.ts
          npx tsx scripts/verify-owner-coupons.ts
          npx tsx scripts/verify-firebase-auth.ts
          npx tsx scripts/verify-production-readiness.ts

      - name: Run TypeScript Validation
        run: npx tsc --noEmit

      - name: Build Next.js Standalone
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci_pipeline_secret_test_32_characters_minimum"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBbGGhlWnPJm2BkwuGWXzpgqA0p233WrHE"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "sabquick-17da6.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "sabquick-17da6"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "sabquick-17da6.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "197455053731"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:197455053731:web:515a1022a23c4047061016"
          FIREBASE_PROJECT_ID: "sabquick-17da6"
          FIREBASE_CLIENT_EMAIL: "firebase-adminsdk-fbsvc@sabquick-17da6.iam.gserviceaccount.com"
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: npm run build

      - name: Verify Production Configuration
        run: npx tsx scripts/verify-prod-config.ts

  build-android-app:
    name: Flutter Android App (analyze + test + APK)
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Static Analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Release APK (debug-signed fallback without key.properties)
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabquick-app-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  deploy-to-vps:
    name: Auto-Deploy to Hostinger VPS
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "ℹ️ VPS_SSH_KEY is not configured in GitHub Secrets. Skipping auto-deploy."
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '187.126.112.24' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/sabquick
            git pull origin main
            # Apply database migrations to production PostgreSQL container
            docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "ALTER TABLE \"User\" ADD COLUMN IF NOT EXISTS pin TEXT;"' || true
            for f in $(find prisma/migrations -name "migration.sql" | sort); do
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$f" || true
            done
            docker compose --env-file .env.prod -f docker-compose.prod.yml build app
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d app
            docker exec sabquick-caddy-prod caddy reload --config /etc/caddy/Caddyfile
            docker ps
