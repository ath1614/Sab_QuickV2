name: SabQuick CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sabquick_admin
          POSTGRES_PASSWORD: sabquick_ci_password
          POSTGRES_DB: sabquick_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations (CI)
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
        run: npx prisma migrate deploy

      - name: Seed Database (CI)
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
        run: npx prisma db seed

      - name: Run Core Test Suite
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci_pipeline_secret_test_32_characters_minimum"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_STORE_LAT: "28.6139"
          NEXT_PUBLIC_STORE_LNG: "77.2090"
          NEXT_PUBLIC_STORE_MAX_RADIUS_KM: "2.5"
        run: |
          npx tsx scripts/verify-db.ts
          npx tsx scripts/verify-auth.ts
          npx tsx scripts/verify-geo.ts
          npx tsx scripts/verify-catalog.ts
          npx tsx scripts/verify-order.ts
          npx tsx scripts/verify-order-tracking.ts
          npx tsx scripts/verify-rider-flow.ts
          npx tsx scripts/verify-ops.ts
          npx tsx scripts/verify-razorpay-coupons-catalog.ts
          npx tsx scripts/verify-production-readiness.ts

      - name: Run TypeScript Validation
        run: npx tsc --noEmit

      - name: Build Next.js Standalone
        env:
          DATABASE_URL: "postgresql://sabquick_admin:sabquick_ci_password@localhost:5432/sabquick_ci_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci_pipeline_secret_test_32_characters_minimum"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build

      - name: Verify Production Configuration
        run: npx tsx scripts/verify-prod-config.ts
